<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-label="라먀니 캐릭터 초상">
<defs>
  <linearGradient id="bg" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#fff7f0"/>
    <stop offset=".48" stop-color="#f6d3bd"/>
    <stop offset="1" stop-color="#df986e"/>
  </linearGradient>
  <linearGradient id="hair" x1=".15" y1=".05" x2=".85" y2=".95">
    <stop offset="0" stop-color="#ffd8b1"/>
    <stop offset=".28" stop-color="#f7bd8a"/>
    <stop offset=".62" stop-color="#ee9d67"/>
    <stop offset="1" stop-color="#d47749"/>
  </linearGradient>
  <linearGradient id="hairShade" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#e78955"/>
    <stop offset="1" stop-color="#bc603e"/>
  </linearGradient>
  <linearGradient id="skin" x1=".3" y1="0" x2=".6" y2="1">
    <stop offset="0" stop-color="#fff8f3"/>
    <stop offset=".7" stop-color="#ffe4d8"/>
    <stop offset="1" stop-color="#f7cdbd"/>
  </linearGradient>
  <linearGradient id="amber" x1=".5" y1="0" x2=".5" y2="1">
    <stop stop-color="#ffd66c"/>
    <stop offset=".5" stop-color="#e99212"/>
    <stop offset="1" stop-color="#8f4713"/>
  </linearGradient>
  <linearGradient id="knit" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fffaf5"/>
    <stop offset="1" stop-color="#e8ddd2"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#6c3c30" flood-opacity=".22"/>
  </filter>
  <filter id="hairGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

